version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aristay-postgres
    environment:
      POSTGRES_DB: aristay_db
      POSTGRES_USER: aristay_user
      POSTGRES_PASSWORD: aristay_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aristay_user -d aristay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aristay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: aristay-api
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: aristay_db
      DB_USER: aristay_user
      DB_PASSWORD: aristay_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: dev_access_secret_key
      JWT_REFRESH_SECRET: dev_refresh_secret_key
      UPLOAD_DIR: /uploads
    volumes:
      - ./src:/app/src
      - uploads:/uploads
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:
  uploads:
